apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: grpc-hello-service-scaledobject
  namespace: grpc-hello-service
spec:
  pollingInterval: 30                                      # Optional. Default: 30 seconds
  cooldownPeriod: 30
  minReplicaCount: 1                                       # Optional. Default: 0
  maxReplicaCount: 1
  scaleTargetRef:
    name: hello-service
  advanced: # Optional. Section to specify advanced options
    horizontalPodAutoscalerConfig: # Optional. Section to specify HPA related options
      behavior: # Optional. Use to modify HPA's scaling behavior
        scaleDown:
          stabilizationWindowSeconds: 30
  triggers:
    - type: prometheus
      metadata:
        # Required fields:
        serverAddress: http://prometheus-server.prometheus-system.svc.cluster.local
        query: avg(http_server_requests_seconds_count {app="hello-service"})
        threshold: '100'
        activationThreshold: '10'


---

apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: to-upper-case-service-scaledobject
  namespace: grpc-hello-service
spec:
  pollingInterval: 30                                      # Optional. Default: 30 seconds
  cooldownPeriod: 30
  minReplicaCount: 1                                       # Optional. Default: 0
  maxReplicaCount: 1
  scaleTargetRef:
    name: to-upper-case-service
  advanced: # Optional. Section to specify advanced options
    horizontalPodAutoscalerConfig: # Optional. Section to specify HPA related options
      behavior: # Optional. Use to modify HPA's scaling behavior
        scaleDown:
          stabilizationWindowSeconds: 30
  triggers:
    - type: prometheus
      metadata:
        # Required fields:
        serverAddress: http://prometheus-server.prometheus-system.svc.cluster.local
        query: avg (grpc_server_received_total{rpc_service="ToUpperCaseService",rpc_type="UNARY"})
        threshold: '100'
        activationThreshold: '10'
