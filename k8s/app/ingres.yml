apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello-service
  namespace: grpc-hello-service
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hello-service
                port:
                  number: 8085
      host: grpc.hello-service.local